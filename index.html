<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Esqueleto e músculos 3D interativos</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #14151a; color: #eceae2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    overflow: hidden;
  }
  #canvas-wrap { position: absolute; inset: 0; }
  canvas { display: block; }

  #tabs {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 4px;
    background: rgba(20,21,26,0.85);
    padding: 4px; border-radius: 10px;
    border: 1px solid #33343c;
    z-index: 5;
  }
  .tab-btn {
    background: none; border: none; cursor: pointer;
    color: #a6a49a; font-size: 13px; font-weight: 600;
    padding: 8px 16px; border-radius: 7px;
    font-family: inherit;
  }
  .tab-btn.active { background: #33343c; color: #f4f2ea; }
  .tab-btn:hover:not(.active) { color: #d8d6cc; }

  #hint {
    position: absolute; top: 16px; left: 16px;
    font-size: 13px; color: #a6a49a;
    background: rgba(20,21,26,0.7);
    padding: 8px 12px; border-radius: 8px;
    max-width: 220px; line-height: 1.5;
    pointer-events: none;
  }

  #loading {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px;
    font-size: 14px; color: #a6a49a;
    background: #14151a;
    z-index: 10;
  }
  #loading.hidden { display: none; }
  #loading-bar-track {
    width: 220px; height: 6px; border-radius: 3px;
    background: #26272f; overflow: hidden;
  }
  #loading-bar-fill {
    height: 100%; width: 0%; background: #7fd0a8;
    transition: width 0.15s ease;
  }
  #loading-sub { font-size: 12px; color: #706f68; max-width: 260px; text-align: center; }

  #info-panel {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: #1c1d24;
    border-top: 1px solid #33343c;
    padding: 18px 20px 22px;
    transform: translateY(100%);
    transition: transform 0.25s ease;
    max-height: 45%;
    overflow-y: auto;
  }
  #info-panel.open { transform: translateY(0); }
  #info-title { font-size: 17px; font-weight: 600; margin: 0 0 8px; color: #f4f2ea; }
  #info-fact { font-size: 14px; line-height: 1.65; margin: 0; color: #c7c5ba; }
  #info-close {
    position: absolute; top: 12px; right: 14px;
    background: none; border: none; color: #a6a49a;
    font-size: 20px; cursor: pointer; line-height: 1;
    padding: 4px 8px;
  }
  #info-close:hover { color: #f4f2ea; }

  #debug-toggle {
    position: absolute; top: 16px; right: 16px;
    font-size: 12px; color: #706f68;
    background: rgba(20,21,26,0.7);
    padding: 6px 10px; border-radius: 8px;
    cursor: pointer; user-select: none;
  }
  #debug-toggle.active { color: #7fd0a8; }
  #debug-readout {
    position: absolute; top: 54px; right: 16px;
    font-size: 11px; color: #7fd0a8;
    background: rgba(20,21,26,0.9);
    padding: 8px 10px; border-radius: 8px;
    display: none; white-space: pre; font-family: monospace;
    max-width: 260px;
  }
  #copy-object-id {
    display: none; margin-top: 6px;
    font-size: 11px; font-family: inherit;
    background: #33343c; color: #eceae2; border: none;
    padding: 4px 8px; border-radius: 5px; cursor: pointer;
  }
  #copy-object-id:hover { background: #40414b; }

  #layer-panel {
    display: none;
    position: absolute; top: 64px; right: 16px;
    background: rgba(20,21,26,0.85);
    border: 1px solid #33343c;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px; color: #c7c5ba;
    max-width: 200px;
    max-height: 60vh;
    overflow-y: auto;
  }
  #layer-panel h4 { margin: 0 0 8px; font-size: 12px; color: #a6a49a; font-weight: 600; }
  .layer-quick-actions { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .layer-quick-actions button {
    font-size: 10px; font-family: inherit;
    background: #33343c; color: #eceae2; border: none;
    padding: 4px 6px; border-radius: 5px; cursor: pointer;
  }
  .layer-quick-actions button:hover { background: #40414b; }
  .layer-check { display: block; margin: 3px 0; cursor: pointer; }
  .layer-check input { margin-right: 6px; }

  #credit {
    position: absolute; bottom: 8px; right: 12px;
    font-size: 10px; color: #55544e;
    line-height: 1.5; text-align: right;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="canvas-wrap"></div>

<div id="tabs">
  <button class="tab-btn active" data-tab="skeleton">Esqueleto</button>
  <button class="tab-btn" data-tab="muscles">Músculos</button>
</div>

<div id="loading">
  <div id="loading-text">Carregando modelo 3D…</div>
  <div id="loading-bar-track"><div id="loading-bar-fill"></div></div>
  <div id="loading-sub"></div>
</div>

<div id="hint">Arraste para girar · scroll para zoom · clique numa parte do modelo</div>
<div id="debug-toggle" onclick="window.toggleDebug()">inspetor (d)</div>
<div id="debug-readout"></div>

<div id="layer-panel">
  <h4>Camadas (tecido)</h4>
  <div class="layer-quick-actions">
    <button data-action="all">mostrar tudo</button>
    <button data-action="muscles-only">só músculos</button>
    <button data-action="hide-bones">esconder ossos</button>
  </div>
  <div id="layer-checkboxes"></div>
</div>

<div id="info-panel">
  <button id="info-close" onclick="window.closePanelUI()">×</button>
  <p id="info-title"></p>
  <p id="info-fact"></p>
  <button id="copy-object-id">copiar Object_ID</button>
</div>

<div id="credit">
  Esqueleto: "Male Skeleton" por LeoVitalis (Sketchfab) · CC BY 4.0<br>
  Músculos: "Myology" por Z-Anatomy (Sketchfab) · CC BY-SA 4.0
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import { createViewer, openInfoPanel, closeInfoPanel } from './src/sharedViewer.js';
import { loadSkeleton, pickSkeletonPart } from './src/skeletonView.js';
import {
  loadMuscles, setLayerVisibility, setAllLayersVisible,
  highlightMesh, clearHighlight, lookupCatalog
} from './src/muscleView.js';

const wrap = document.getElementById('canvas-wrap');
const viewer = createViewer(wrap);

const state = {
  activeTab: 'skeleton',
  debug: false,
  skeleton: null, // { root, hitboxes, box }
  muscles: null,  // { root, meshes, materialNames }
  lastObjectId: '',
};

// ---------- overlay de carregamento ----------
const loadingEl = document.getElementById('loading');
const loadingText = document.getElementById('loading-text');
const loadingSub = document.getElementById('loading-sub');
const loadingFill = document.getElementById('loading-bar-fill');

function showLoading(text, sub) {
  loadingEl.classList.remove('hidden');
  loadingText.textContent = text;
  loadingSub.textContent = sub || '';
  loadingFill.style.width = '0%';
}
function progressHandler(evt) {
  if (evt && evt.total) {
    const pct = Math.min(100, Math.round((evt.loaded / evt.total) * 100));
    loadingFill.style.width = pct + '%';
    loadingText.textContent = `Carregando… ${pct}%`;
  }
}
function hideLoading() { loadingEl.classList.add('hidden'); }

// ---------- carregamento com lazy load + cache ----------
async function ensureSkeletonLoaded() {
  if (state.skeleton) return state.skeleton;
  showLoading('Carregando esqueleto…', '');
  state.skeleton = await loadSkeleton(viewer.scene, progressHandler);
  hideLoading();
  return state.skeleton;
}

async function ensureMusclesLoaded() {
  if (state.muscles) return state.muscles;
  showLoading('Carregando músculos…', 'Modelo pesado (~150MB) — isso pode levar um tempo na primeira vez. Depois fica em cache.');
  state.muscles = await loadMuscles(viewer.scene, progressHandler);
  buildLayerFilters(state.muscles.materialNames);
  hideLoading();
  return state.muscles;
}

// ---------- alternância de abas ----------
function setVisible(which) {
  if (state.skeleton) {
    state.skeleton.root.visible = which === 'skeleton';
    state.skeleton.hitboxes.forEach((h) => { h.visible = which === 'skeleton'; });
  }
  if (state.muscles) {
    state.muscles.root.visible = which === 'muscles';
  }
  document.getElementById('layer-panel').style.display = which === 'muscles' && state.muscles ? 'block' : 'none';
}

async function activateTab(tab) {
  state.activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
  closeInfoPanel();
  clearHighlight();
  document.getElementById('debug-readout').textContent = '';
  document.getElementById('copy-object-id').style.display = 'none';

  if (tab === 'skeleton') {
    const s = await ensureSkeletonLoaded();
    setVisible('skeleton');
    viewer.frameOnObject(s.root, { targetHeightFrac: 0.3, cameraHeightFrac: 0.35, distanceMul: 1.3 });
  } else {
    const m = await ensureMusclesLoaded();
    setVisible('muscles');
    viewer.frameOnObject(m.root, { targetHeightFrac: 0.5, cameraHeightFrac: 0.55, distanceMul: 1.5 });
  }
}

document.querySelectorAll('.tab-btn').forEach((btn) => {
  btn.addEventListener('click', () => activateTab(btn.dataset.tab));
});

// ---------- clique / raycaster ----------
viewer.renderer.domElement.addEventListener('click', (e) => {
  if (state.activeTab === 'skeleton' && state.skeleton) {
    const hits = viewer.pickAt(e.clientX, e.clientY, state.skeleton.hitboxes);
    if (state.debug) {
      if (hits.length) {
        const p = hits[0].point;
        document.getElementById('debug-readout').textContent =
          `x: ${p.x.toFixed(1)}\ny: ${p.y.toFixed(1)}\nz: ${p.z.toFixed(1)}`;
      }
      return;
    }
    const part = pickSkeletonPart(hits);
    if (part) openInfoPanel(part.name, part.fact);
    return;
  }

  if (state.activeTab === 'muscles' && state.muscles) {
    const hits = viewer.pickAt(e.clientX, e.clientY, state.muscles.meshes);
    if (!hits.length) return;
    const mesh = hits[0].object;
    highlightMesh(mesh);
    state.lastObjectId = mesh.name;

    if (state.debug) {
      const p = hits[0].point;
      document.getElementById('debug-readout').textContent =
        `objeto: ${mesh.name}\nmaterial: ${mesh.userData.materialName}\nx: ${p.x.toFixed(3)}  y: ${p.y.toFixed(3)}  z: ${p.z.toFixed(3)}`;
      document.getElementById('copy-object-id').style.display = 'inline-block';
      return;
    }

    const entry = lookupCatalog(mesh);
    if (entry) {
      openInfoPanel(entry.name, entry.fact);
    } else {
      openInfoPanel(
        `Estrutura não identificada (${mesh.name})`,
        `Tecido: ${mesh.userData.materialName}. Esse objeto ainda não foi catalogado — ative o modo inspetor pra identificar e adicione a entrada em src/muscleCatalog.js.`
      );
    }
  }
});

// ---------- modo inspetor ----------
window.toggleDebug = function toggleDebug() {
  state.debug = !state.debug;
  document.getElementById('debug-readout').style.display = state.debug ? 'block' : 'none';
  document.getElementById('debug-toggle').classList.toggle('active', state.debug);
  if (!state.debug) document.getElementById('copy-object-id').style.display = 'none';
};
window.addEventListener('keydown', (e) => { if (e.key === 'd') window.toggleDebug(); });

document.getElementById('copy-object-id').addEventListener('click', () => {
  if (state.lastObjectId) navigator.clipboard.writeText(state.lastObjectId);
});

window.closePanelUI = () => closeInfoPanel();

// ---------- filtro de camadas (aba músculos) ----------
function buildLayerFilters(materialNames) {
  const container = document.getElementById('layer-checkboxes');
  container.innerHTML = '';
  materialNames.forEach((name) => {
    const label = document.createElement('label');
    label.className = 'layer-check';
    label.innerHTML = `<input type="checkbox" checked /> ${name}`;
    const input = label.querySelector('input');
    input.dataset.material = name;
    input.addEventListener('change', (e) => {
      setLayerVisibility(state.muscles.meshes, name, e.target.checked);
    });
    container.appendChild(label);
  });
  document.getElementById('layer-panel').style.display = 'block';
}

function syncCheckboxes(visibleMaterials) {
  document.querySelectorAll('#layer-checkboxes input').forEach((input) => {
    input.checked = visibleMaterials.has(input.dataset.material);
  });
}

document.querySelectorAll('.layer-quick-actions button').forEach((btn) => {
  btn.addEventListener('click', () => {
    if (!state.muscles) return;
    const action = btn.dataset.action;
    if (action === 'all') {
      setAllLayersVisible(state.muscles.meshes, true);
      syncCheckboxes(new Set(state.muscles.materialNames));
    } else if (action === 'muscles-only') {
      setAllLayersVisible(state.muscles.meshes, false);
      setLayerVisibility(state.muscles.meshes, 'Muscles.001', true);
      syncCheckboxes(new Set(['Muscles.001']));
    } else if (action === 'hide-bones') {
      setLayerVisibility(state.muscles.meshes, 'Bone', false);
      const visible = new Set(state.muscles.materialNames.filter((n) => n !== 'Bone'));
      syncCheckboxes(visible);
    }
  });
});

// ---------- estado inicial: aba Esqueleto carrega de cara ----------
activateTab('skeleton');
</script>
</body>
</html>
